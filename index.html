<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFAGS Çekirdek Simülatörü</title>
    <style>
        /* CSS Reset ve Genel Stil */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            padding: 20px;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1000px;
            height: 700px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Kontrol Paneli */
        #ctrl {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            flex-wrap: wrap;
            align-items: center;
            background: #f9fafb;
        }

        .btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #374151;
            transition: all 0.2s;
        }

        .btn:hover { background: #f3f4f6; border-color: #9ca3af; }

        .lang-sel {
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            cursor: pointer;
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dp { background: #3b82f6; } /* Proton - Mavi */
        .dn { background: #22c55e; } /* Nötron - Yeşil */
        
        .breset { margin-left: auto; color: #6b7280; border: none; background: transparent; }
        .breset:hover { color: #ef4444; background: transparent; }

        /* Bilgi Çubukları */
        #infobar {
            padding: 10px 15px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            min-height: 45px;
            background: #ffffff;
        }

        .pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; border: 1px solid #e5e7eb; background: #f3f4f6; color: #1f2937; }
        .bs { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: #dcfce7; color: #166534; } /* Kararlı */
        .bu { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: #fee2e2; color: #991b1b; } /* Kararsız */
        .br { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: #fef3c7; color: #92400e; } /* Radyoaktif */

        #decaybar {
            padding: 8px 15px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            min-height: 42px;
            background: #fdfdfd;
        }

        .dbtn {
            padding: 5px 12px;
            border-radius: 99px;
            border: 1px solid;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .dbtn:active { transform: scale(0.95); }

        .da { background: #fff7ed; color: #9a3412; border-color: #fdba74; }
        .db { background: #eff6ff; color: #1e40af; border-color: #93c5fd; }
        .dbp { background: #fffbeb; color: #92400e; border-color: #fcd34d; }
        .dec { background: #f5f3ff; color: #5b21b6; border-color: #ddd6fe; }
        .dg { background: #f9fafb; color: #4b5563; border-color: #d1d5db; }
        .dsf { background: #fef2f2; color: #991b1b; border-color: #fecaca; }

        /* Canvas Alanı */
        #cvwrap { flex: 1; position: relative; overflow: hidden; background: #f8fafc; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #empty {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #9ca3af;
            font-size: 14px;
            pointer-events: none;
            text-align: center;
            line-height: 1.6;
        }

        #logbar {
            padding: 8px 15px;
            border-top: 1px solid #e5e7eb;
            font-size: 12px;
            color: #6b7280;
            min-height: 30px;
            background: #ffffff;
        }
    </style>
</head>
<body>

<div id="app">
  <div id="ctrl">
    <select class="lang-sel" onchange="setLang(this.value)">
      <option value="tr">TR</option>
      <option value="de">DE</option>
      <option value="en">EN</option>
    </select>
    <button class="btn" onclick="addP('proton')" id="btnP"><span class="dot dp"></span>Proton ekle</button>
    <button class="btn" onclick="addP('neutron')" id="btnN"><span class="dot dn"></span>Nötron ekle</button>
    <button class="btn" onclick="remP('proton')" id="btnRP">− Proton</button>
    <button class="btn" onclick="remP('neutron')" id="btnRN">− Nötron</button>
    <button class="btn breset" onclick="doReset()" id="btnRes">Sıfırla</button>
  </div>
  <div id="infobar"></div>
  <div id="decaybar"></div>
  <div id="cvwrap">
    <div id="empty"></div>
    <canvas id="cv"></canvas>
  </div>
  <div id="logbar"></div>
</div>

const STABLE_N = {
  1:[0,1], 2:[1,2], 3:[3,4], 4:[5], 5:[5,6], 6:[6,7], 7:[7,8], 8:[8,9,10], 9:[10], 10:[10,11,12],
  11:[12], 12:[12,13,14], 13:[14], 14:[14,15,16], 15:[16], 16:[16,17,18,20], 17:[18,20], 18:[18,20,22], 19:[20,22], 20:[20,22,23,24,26,28],
  21:[24], 22:[24,25,26,27,28], 23:[28], 24:[26,28,29,30,32], 25:[30], 26:[28,30,31,32], 27:[32], 28:[30,32,33,34,36], 29:[34,36], 30:[34,36,37,38,40],
  31:[38,40], 32:[38,40,41,42,44], 33:[42], 34:[40,42,43,44,46], 35:[44,46], 36:[42,44,46,47,48,50], 37:[48,50], 38:[46,48,49,50], 39:[50], 40:[50,51,52,54],
  41:[52], 42:[50,52,53,54,56,58], 43:[], 44:[52,54,55,56,57,58,60], 45:[58], 46:[56,58,59,60,62,64], 47:[60,62], 48:[58,62,63,64,66,68], 49:[64,66], 50:[62,64,65,66,68,69,70,72,74],
  51:[70,72], 52:[68,70,71,72,74,76], 53:[74], 54:[70,72,74,75,76,78,80], 55:[78], 56:[74,76,78,79,80,82], 57:[82], 58:[78,80,82,84], 59:[82], 60:[82,83,84,86],
  61:[], 62:[82,85,86,88,90], 63:[88,90], 64:[88,90,91,92,94,96], 65:[94], 66:[90,92,94,95,96,97,98], 67:[98], 68:[94,96,98,99,100,102], 69:[100], 70:[98,100,101,102,103,104,106],
  71:[104,105], 72:[102,104,105,106,108], 73:[108], 74:[106,108,109,110,112], 75:[110,112], 76:[108,110,111,112,114,116], 77:[114,116], 78:[112,114,116,117,118,120], 79:[118], 80:[116,118,119,120,121,122,124],
  81:[122,124], 82:[124,125,126], 83:[126]
};

const LONG_LIVED_RADIO = new Set(["19-21","37-50","71-105","75-112","83-126"]);

function getDecayModes(Z, N) {
  if (Z===0) return [];
  if (Z>118) return ["beta-"];
  if (Z>=84) {
    if (Z>=92) return ["alpha","sf"];
    if (Z>=89) return ["alpha","beta-"];
    return ["alpha"];
  }
  const sns=STABLE_N[Z]||[];
  if (sns.length===0) return (N/Math.max(Z,1) < 1.1) ? ["beta+","ec"] : ["beta-"];
  const minN=Math.min(...sns), maxN=Math.max(...sns);
  if (N>maxN) return (Z>=50&&N-maxN>=4)?["beta-","alpha"]:["beta-"];
  if (N<minN) return (Z<=10)?["beta+"]:(Z<=30)?["beta+","ec"]:["ec","beta+"];
  return (N/Math.max(Z,1) >= 1) ? ["beta-"] : ["beta+","ec"];
}

function getStability(Z, N) {
  const d=DICT[L].whys;
  if (Z===0&&N===0) return null;
  if (Z===0) return {st:"unstable",why:d.noP,modes:[]};
  if (Z>118) return {st:"unstable",why:d.unknown,modes:["beta-"]};
  const sns=STABLE_N[Z];
  if (sns!==undefined&&sns.length===0) return {st:"radioactive",why:d.radioactiveAll,modes:getDecayModes(Z,N)};
  if (Z>=84) return {st:"radioactive",why:Z>=92?d.actinide:d.natural,modes:getDecayModes(Z,N)};
  const key=Z+"-"+N;
  if (LONG_LIVED_RADIO.has(key)) return {st:"radioactive",why:d.longLived,modes:getDecayModes(Z,N)};
  if (sns&&sns.includes(N)) return {st:"stable",why:d.stableIso,modes:[]};
  const modes=getDecayModes(Z,N), sns2=sns||[];
  let why= sns2.length>0 ? (N>Math.max(...sns2)?d.nExcess:(N<Math.min(...sns2)?d.pExcess:d.gap)) : d.noStable;
  return {st:"unstable",why,modes};
}

let protons=[],neutrons=[],ejected=[],raf;
const cv=document.getElementById('cv'),ctx2=cv.getContext('2d'),cvwrap=document.getElementById('cvwrap');

function resize(){cv.width=cvwrap.clientWidth;cv.height=cvwrap.clientHeight;draw();}
new ResizeObserver(resize).observe(cvwrap);

function nucR(){return Math.max(14,Math.min(95,8+Math.cbrt(protons.length+neutrons.length)*10));}

function findPos(cx,cy,r){
  const all=[...protons,...neutrons];
  for(let t=0;t<500;t++){
    const a=Math.random()*Math.PI*2,d=Math.random()*r,x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d;
    if(all.every(p=>Math.hypot(p.x-x,p.y-y)>14.2)) return {x,y};
  }
  const a=Math.random()*Math.PI*2;return{x:cx+Math.cos(a)*r*0.6,y:cy+Math.sin(a)*r*0.6};
}

function addP(type){
  const cx=cv.width/2,cy=cv.height/2,pos=findPos(cx,cy,nucR()+5);
  const p={x:pos.x,y:pos.y,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,type};
  if(type==='proton') protons.push(p); else neutrons.push(p);
  document.getElementById('empty').style.display='none';
  updateUI();cancelAnimationFrame(raf);animate();
}

function remP(type){
  if(type==='proton'&&protons.length>0) protons.pop();
  else if(type==='neutron'&&neutrons.length>0) neutrons.pop();
  if(!protons.length&&!neutrons.length) document.getElementById('empty').style.display='';
  updateUI();
}

function doReset(){
  protons=[];neutrons=[];ejected=[];
  document.getElementById('empty').style.display='';
  document.getElementById('logbar').textContent='';
  updateUI();draw();
}

function elLabel(Z,N){const e=Z>=1&&Z<=118?EL[Z]:null;return e?`${e.s}-${Z+N}`:`Z${Z}-${Z+N}`;}

function doDecay(mode){
  const Z=protons.length,N=neutrons.length;if(Z===0) return;
  const cx=cv.width/2,cy=cv.height/2,ang=Math.random()*Math.PI*2,spd=3.8;
  const before=elLabel(Z,N);
  if(mode==='alpha'){
    if(Z<2||N<2) return;
    const grp=[protons.pop(),protons.pop(),neutrons.pop(),neutrons.pop()];
    ejected.push({type:'alpha',label:'α',particles:grp,cx,cy,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:1.0});
  } else if(mode==='beta-'){
    const np=neutrons.pop();np.type='proton';protons.push(np);
    ejected.push({type:'electron',cx,cy,vx:Math.cos(ang)*spd*2,vy:Math.sin(ang)*spd*2,life:1.0,particles:[]});
  } else if(mode==='beta+'){
    const np=protons.pop();np.type='neutron';neutrons.push(np);
    ejected.push({type:'positron',cx,cy,vx:Math.cos(ang)*spd*2,vy:Math.sin(ang)*spd*2,life:1.0,particles:[]});
  } else if(mode==='ec'){
    const np=protons.pop();np.type='neutron';neutrons.push(np);
    ejected.push({type:'neutrino',cx,cy,vx:Math.cos(ang)*spd*3,vy:Math.sin(ang)*spd*3,life:0.8,particles:[]});
  } else if(mode==='gamma'){
    ejected.push({type:'gamma',cx,cy,vx:Math.cos(ang)*spd*2.5,vy:Math.sin(ang)*spd*2.5,life:1.0,particles:[]});
  } else if(mode==='sf'){
    const hp=Math.floor(Z/2),hn=Math.floor(N/2),g1=[],g2=[];
    for(let i=0;i<hp;i++) g1.push(protons.pop());for(let i=0;i<hn;i++) g1.push(neutrons.pop());
    while(protons.length) g2.push(protons.pop());while(neutrons.length) g2.push(neutrons.pop());
    ejected.push({type:'fission',particles:g1,cx,cy,vx:Math.cos(ang)*spd*1.8,vy:Math.sin(ang)*spd*1.8,life:1.0});
    ejected.push({type:'fission',particles:g2,cx,cy,vx:Math.cos(ang+Math.PI)*spd*1.8,vy:Math.sin(ang+Math.PI)*spd*1.8,life:1.0});
  }
  document.getElementById('logbar').textContent=`${DICT[L].modes[mode]}: ${before} → ${elLabel(protons.length,neutrons.length)}`;
  updateUI();
}

const DINFO={'alpha':{cls:'da'},'beta-':{cls:'db'},'beta+':{cls:'dbp'},'ec':{cls:'dec'},'gamma':{cls:'dg'},'sf':{cls:'dsf'}};

function updateUI(){
  const Z=protons.length,N=neutrons.length,ib=document.getElementById('infobar'),db=document.getElementById('decaybar');
  const d=DICT[L];
  if(Z===0&&N===0){ib.innerHTML=`<span style="color:#9ca3af">${d.startInfo}</span>`;db.innerHTML='';return;}
  const stab=getStability(Z,N),el=Z>=1&&Z<=118?EL[Z]:null;
  let ih=el?`<span class="pill">${el.s} — ${el.n}</span>`:'';
  ih+=`<span class="pill">Z=${Z} N=${N} A=${Z+N}</span>`;
  if(stab){
    const bc=stab.st==='stable'?'bs':stab.st==='radioactive'?'br':'bu';
    ih+=`<span class="${bc}">${stab.st==='stable'?d.stable:(stab.st==='radioactive'?d.radioactive:d.unstable)}</span>`;
    ih+=`<span style="font-size:11px;color:#6b7280;margin-left:4px">${stab.why}</span>`;
  }
  ib.innerHTML=ih;
  let dh='';
  if(stab&&stab.modes&&stab.modes.length){
    stab.modes.forEach(m=>{if(DINFO[m]) dh+=`<button class="dbtn ${DINFO[m].cls}" onclick="doDecay('${m}')">${d.modes[m]}</button>`;});
    dh+=`<button class="dbtn dg" onclick="doDecay('gamma')" style="opacity:0.6">${d.modes.gamma}</button>`;
  }
  db.innerHTML=dh;
}

function physicsStep(){
  const cx=cv.width/2,cy=cv.height/2,r=nucR(),all=[...protons,...neutrons];
  for(let p of all){
    p.vx-=(p.x-cx)*0.014;p.vy-=(p.y-cy)*0.014;
    for(let q of all){if(q===p)continue;let ex=p.x-q.x,ey=p.y-q.y,ed=Math.hypot(ex,ey)||.01;if(ed<15){let f=.65/(ed*ed+.5);p.vx+=(ex/ed)*f*13;p.vy+=(ey/ed)*f*13;}}
    p.vx*=.83;p.vy*=.83;p.x+=p.vx;p.y+=p.vy;
    if(Math.hypot(p.x-cx,p.y-cy)>r+7){let a=Math.atan2(p.y-cy,p.x-cx);p.x=cx+Math.cos(a)*(r+6);p.y=cy+Math.sin(a)*(r+6);p.vx*=-.4;p.vy*=-.4;}
  }
  for(let e of ejected){
    e.cx+=e.vx;e.cy+=e.vy;e.vx*=.985;e.vy*=.985;
    for(let p of e.particles){p.x+=e.vx;p.y+=e.vy;}
    e.life-=.016;
  }
  ejected=ejected.filter(e=>e.life>0);
}

function draw(){
  ctx2.clearRect(0,0,cv.width,cv.height);
  const drawN=(p,a=1)=>{
    ctx2.globalAlpha=a;ctx2.beginPath();ctx2.arc(p.x,p.y,7,0,Math.PI*2);
    ctx2.fillStyle=p.type==='proton'?'#3b82f6':'#22c55e';ctx2.fill();
    ctx2.fillStyle='#fff';ctx2.font='bold 7px sans-serif';ctx2.textAlign='center';
    ctx2.fillText(p.type==='proton'?'p':'n',p.x,p.y+2.5);ctx2.globalAlpha=1;
  };
  protons.forEach(p=>drawN(p));neutrons.forEach(n=>drawN(n));
  ejected.forEach(e=>{
    if(e.type==='alpha'||e.type==='fission') e.particles.forEach(p=>drawN(p,e.life));
    else if(e.type==='gamma'){ctx2.beginPath();ctx2.strokeStyle='#94a3b8';ctx2.lineWidth=2;ctx2.moveTo(e.cx,e.cy);ctx2.lineTo(e.cx+e.vx*8,e.cy+e.vy*8);ctx2.stroke();}
    else{ctx2.beginPath();ctx2.arc(e.cx,e.cy,4,0,Math.PI*2);ctx2.fillStyle='#475569';ctx2.fill();}
  });
}

function animate(){physicsStep();draw();raf=requestAnimationFrame(animate);}

function setLang(lang){
  L=lang;const d=DICT[L];
  document.getElementById('btnP').innerHTML=`<span class="dot dp"></span>${d.addP}`;
  document.getElementById('btnN').innerHTML=`<span class="dot dn"></span>${d.addN}`;
  document.getElementById('btnRP').innerText=d.remP;
  document.getElementById('btnRN').innerText=d.remN;
  document.getElementById('btnRes').innerText=d.reset;
  document.getElementById('empty').innerHTML=d.empty;
  updateUI();
}

setLang('tr');
resize();
</script>
